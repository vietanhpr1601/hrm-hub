server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cho phép tải file Excel nhân viên, ảnh, tài liệu công việc.
    client_max_body_size 20m;

    # Mọi lời gọi /api chuyển sang container backend (cùng mạng docker compose).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # File build của Vite có mã băm trong tên nên cache lâu được.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ứng dụng một trang (SPA): đường dẫn lạ trả về index.html để React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
