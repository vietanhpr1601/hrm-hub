spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${MAIL_SSL:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  application:
    name: hrm
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Hihi@1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  main:
    allow-bean-definition-overriding: true

groq:
  api:
    key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d}
  expiration: 300000          # 5 phút (5 * 60 * 1000 ms)
  refresh-expiration: 86400000  # 1 ngày (24 * 60 * 60 * 1000 ms)

app:
  mail:
    enabled: ${PAYROLL_MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  attendance:
    location:
      max-accuracy-meters: ${ATTENDANCE_MAX_ACCURACY_METERS:300}
      target-accuracy-meters: ${ATTENDANCE_TARGET_ACCURACY_METERS:20}
      acquisition-timeout-ms: ${ATTENDANCE_LOCATION_TIMEOUT_MS:25000}
    workplace:
      name: ${ATTENDANCE_WORKPLACE_NAME:}
      latitude: ${ATTENDANCE_WORKPLACE_LATITUDE:}
      longitude: ${ATTENDANCE_WORKPLACE_LONGITUDE:}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
    email: ${ADMIN_EMAIL:admin@hrm.com}
